name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode (the glass effects need the macOS 26 SDK)
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Assemble app bundle (ad-hoc signed)
        run: SIGN_IDENTITY=- ./scripts/make-app.sh
